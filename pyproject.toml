[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nephrolithiasis-metabolic-engine"
version = "2.0.0"
description = "StoneMind: 24-Hour Urine Metabolic Workup & Kidney Stone Recurrence Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.5,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
nephrolithiasis-metabolic-engine = "nephrolithiasis_metabolic_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/nephrolithiasis-metabolic-agent"
Repository = "https://github.com/abusuraihsakhri/nephrolithiasis-metabolic-engine.git"
