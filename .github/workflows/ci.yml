name: Test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Create ephemeral audit signing key
        run: echo "AUDIT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Python syntax and test suite
        run: |
          python -m compileall -q agents nephrolithiasis_metabolic_agent cli.py stone_mind.py
          python -m pytest -q
      - name: Security smoke test
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
      - name: Browser demonstration tests
        run: |
          node --check web/app.js
          node --test web/app.test.cjs
